# Web hosting for the OnMyLead web app (ride link previews, family links, sign-in).
# Set EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY and EXPO_PUBLIC_WEB_URL
# in the Netlify site's environment variables; they are baked in at build time.
[build]
  base = "app"
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send every path (/r/CODE, /f/TOKEN, /auth-callback) to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
