server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # nginx drops server-level add_header in any location that sets its own,
    # so the security headers live in one file included everywhere.
    include /etc/nginx/security-headers.conf;

    # Build files have a content hash in their names, so they can be cached for good.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Home-screen install files. Listed exactly so a missing file 404s instead
    # of falling back to index.html.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    location ~ ^/(apple-touch-icon\.png|icons/.+\.png)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/security-headers.conf;
    }

    # Universal Links: Apple reads this to let ride and group links (/r/*, /g/*) and ride QR codes
    # open in the iPhone app. It must be served as JSON, with no redirect and no index.html fallback.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        types { }
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    # Android App Links: Android reads this to open ride and group links (/r/*, /g/*) in the
    # Android app. Same rules as the Apple file: JSON, no redirect, no index.html fallback.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        types { }
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    # The owner-only Admin Dashboard: same app, kept out of search engines and caches.
    location ^~ /admin {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/security-headers.conf;
    }

    # The Help Center: static pages built by app/scripts/help/build.mjs, so search engines read
    # real HTML. /help/create-a-ride is help/create-a-ride.html; anything missing gets the help 404
    # page (never the app), with a real 404 status.
    location ^~ /help/ {
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /help/404.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    location = /help {
        try_files /help/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    location ^~ /help/assets/ {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/security-headers.conf;
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/security-headers.conf;
    }
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    # Every other path is a screen of the app (/r/CODE, /f/TOKEN, /auth-callback…).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
