server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # nginx drops server-level add_header in any location that sets its own,
    # so the security headers live in one file included everywhere.
    include /etc/nginx/security-headers.conf;

    # Build files have a content hash in their names, so they can be cached for good.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Home-screen install files. Listed exactly so a missing file 404s instead
    # of falling back to index.html.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
    location ~ ^/(apple-touch-icon\.png|icons/.+\.png)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/security-headers.conf;
    }

    # Every other path is a screen of the app (/r/CODE, /f/TOKEN, /auth-callback…).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
