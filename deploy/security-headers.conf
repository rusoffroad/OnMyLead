# Included in every location (see nginx.conf). The app talks only to its Supabase project
# (data, sign-in, live updates, machine photos), NHTSA's free VIN lookup, and the RUS Offroad
# store's public product list (product images are served from rusoffroad.com). Cloudflare
# injects its Web Analytics beacon on onmylead.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://rusoffroad.com https://www.rusoffroad.com; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vpic.nhtsa.dot.gov https://rusoffroad.com https://www.rusoffroad.com https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Strict-Transport-Security "max-age=31536000" always;
