# Included in every location (see nginx.conf). The app talks only to its Supabase project
# (data, sign-in, live updates, machine photos), NHTSA's free VIN lookup, the RUS Offroad
# store's public product list (product images are served from rusoffroad.com), Esri's satellite
# tiles on the Find a Ride map (rides-map.web.tsx), Photon place search (core/places.ts) and the
# Open-Meteo forecast on the ride page (core/ride-day.ts).
# Cloudflare injects its Web Analytics beacon on onmylead.com. OpenFreeMap's OpenStreetMap
# squares draw trails on the website's route builder and snap routes to them (lib/trail-tiles.web.ts);
# the agency trail and topo layers are phone-only, so they are not listed.
# The Admin Dashboard's Help page reads the Help Center audit report from the public repo
# (raw.githubusercontent.com), asks GitHub what changed since (api.github.com) and asks Apple which
# app version is live (itunes.apple.com); lib/help-admin.ts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://rusoffroad.com https://www.rusoffroad.com https://server.arcgisonline.com https://*.googleusercontent.com https://*.fbsbx.com https://graph.facebook.com; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vpic.nhtsa.dot.gov https://rusoffroad.com https://www.rusoffroad.com https://photon.komoot.io https://api.open-meteo.com https://tiles.openfreemap.org https://cloudflareinsights.com https://raw.githubusercontent.com https://api.github.com https://itunes.apple.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Strict-Transport-Security "max-age=31536000" always;
